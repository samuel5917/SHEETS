<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Pro | Sistema de Remanejo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://lucide.dev/icons/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #09090b;
            --card-dark: #121214;
            --accent-blue: #3b82f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #e4e4e7;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        .glass-card {
            background: var(--card-dark);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-field {
            background: #18181b !important;
            border: 1px solid #27272a !important;
            color: white !important;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: var(--accent-blue) !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
            outline: none;
        }

        .btn-submit {
            background: var(--accent-blue);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-submit:hover:not(:disabled) {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }

        .btn-submit:active { transform: translateY(0); }

        /* Animação de sucesso */
        @keyframes success-pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .success-glow { animation: success-pulse 1.5s infinite; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl glass-card rounded-2xl overflow-hidden">
        <div class="p-6 border-b border-white/5 flex justify-between items-center bg-gradient-to-r from-blue-600/10 to-transparent">
            <div>
                <h1 class="text-xl font-800 tracking-tight flex items-center gap-2">
                    <i data-lucide="refresh-cw" class="text-blue-500"></i>
                    REMANEJO DE MATERIAIS
                </h1>
                <p class="text-slate-500 text-[10px] uppercase tracking-[0.2em] font-bold mt-1">Sincronização Direta Google Sheets</p>
            </div>
            <div id="status-badge" class="px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-[9px] font-bold flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span>
                READY
            </div>
        </div>

        <form id="remanejoForm" class="p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div class="space-y-2">
                    <label class="text-[10px] text-slate-400 font-bold uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="barcode" size="14"></i> TAG CB
                    </label>
                    <input type="text" id="tag_cb" required placeholder="Ex: CB-1234" class="input-field w-full p-3 rounded-lg font-mono text-sm">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] text-slate-400 font-bold uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="box" size="14"></i> Material
                    </label>
                    <input type="text" id="material" required placeholder="Nome do item" class="input-field w-full p-3 rounded-lg text-sm">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] text-slate-400 font-bold uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="log-out" size="14"></i> Origem
                    </label>
                    <input type="text" id="origem" required placeholder="Local de saída" class="input-field w-full p-3 rounded-lg text-sm">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] text-slate-400 font-bold uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="log-in" size="14"></i> Destino
                    </label>
                    <input type="text" id="destino" required placeholder="Local de entrada" class="input-field w-full p-3 rounded-lg text-sm">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] text-slate-400 font-bold uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="weight" size="14"></i> Peso Total (KG)
                    </label>
                    <input type="number" step="0.01" id="peso" required placeholder="0.00" class="input-field w-full p-3 rounded-lg font-mono text-emerald-400 text-sm">
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] text-slate-400 font-bold uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="clock" size="14"></i> Turno
                    </label>
                    <select id="turno" class="input-field w-full p-3 rounded-lg text-sm appearance-none">
                        <option value="Turno A">Turno A (Manhã)</option>
                        <option value="Turno B">Turno B (Tarde)</option>
                        <option value="Turno C">Turno C (Noite)</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit w-full mt-8 py-4 rounded-xl text-white font-800 text-sm uppercase tracking-widest flex items-center justify-center gap-3">
                <i data-lucide="database"></i> 
                Registrar Movimentação
            </button>
        </form>

        <div class="bg-black/20 p-4 border-t border-white/5 flex justify-between items-center">
            <span class="text-[9px] text-slate-600 font-mono tracking-tighter">DATA_SYNC_PROTOCOL: ACTIVE</span>
            <div class="flex gap-2">
                <div class="w-1.5 h-1.5 rounded-full bg-slate-800"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-slate-800"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-slate-800"></div>
            </div>
        </div>
    </div>

    <script>
        // Inicializa Ícones
        lucide.createIcons();

        // Configuração da sua API
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxN6ww6Cq7H9f-dcFz0Cg7kkImi3zjBr7_xVrX9uSTfQc4OLnnZZUrIcf1NZaRhmE2lfQ/exec";

        const form = document.getElementById('remanejoForm');
        const btn = document.getElementById('btnSubmit');
        const badge = document.getElementById('status-badge');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Estado de Carregamento
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="animate-spin"></i> ENVIANDO PARA NUVEM...`;
            badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-yellow-500 animate-ping"></span> BUSY`;
            badge.className = badge.className.replace('text-blue-400', 'text-yellow-400');
            lucide.createIcons();
            
            const payload = {
                tag_cb: document.getElementById('tag_cb').value,
                material: document.getElementById('material').value,
                origem: document.getElementById('origem').value,
                destino: document.getElementById('destino').value,
                peso: document.getElementById('peso').value,
                turno: document.getElementById('turno').value,
                data: new Date().toLocaleDateString('pt-BR'),
                horario: new Date().toLocaleTimeString('pt-BR')
            };

            try {
                // Envio dos dados
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Estado de Sucesso
                btn.classList.remove('bg-blue-600');
                btn.classList.add('bg-emerald-600', 'success-glow');
                btn.innerHTML = `<i data-lucide="check-circle"></i> SUCESSO! DADO GRAVADO`;
                badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> SYNCED`;
                badge.className = badge.className.replace('text-yellow-400', 'text-emerald-400');
                lucide.createIcons();
                
                form.reset();
                
                // Resetar botão após 3 segundos
                setTimeout(() => {
                    btn.disabled = false;
                    btn.classList.remove('bg-emerald-600', 'success-glow');
                    btn.classList.add('bg-blue-600');
                    btn.innerHTML = `<i data-lucide="database"></i> Registrar Movimentação`;
                    badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span> READY`;
                    badge.className = badge.className.replace('text-emerald-400', 'text-blue-400');
                    lucide.createIcons();
                }, 3000);

            } catch (error) {
                console.error("Erro de sincronização:", error);
                btn.disabled = false;
                btn.className = "btn-submit w-full mt-8 py-4 rounded-xl text-white font-800 text-sm uppercase bg-red-600";
                btn.innerHTML = `<i data-lucide="alert-triangle"></i> ERRO NA REDE`;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
