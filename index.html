<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remanejo Enterprise | Logistics Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://lucide.dev/icons/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #fafafa; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: #121214; border: 1px solid #27272a; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        input, select { background: #1c1c1f !important; border: 1px solid #3f3f46 !important; color: white !important; outline: none !important; }
        input:focus { border-color: #3b82f6 !important; ring: 1px solid #3b82f6; }
        .btn-loading { pointer-events: none; opacity: 0.7; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl glass rounded-2xl p-8 border-t-4 border-t-blue-600">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2 tracking-tight">
                    <i data-lucide="layout-grid" class="text-blue-500"></i> LOGISTICS PRO
                </h1>
                <p class="text-zinc-500 text-[10px] uppercase tracking-[0.2em] font-bold mt-1">Registro de Remanejo em Tempo Real</p>
            </div>
            <div id="status-badge" class="px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-500 text-[10px] font-bold border border-emerald-500/20">
                DATABASE CONNECTED
            </div>
        </div>

        <form id="formRemanejo" class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-zinc-500 uppercase">TAG CB</label>
                    <input type="text" id="tag_cb" required class="w-full p-3 rounded-xl text-sm mono" placeholder="Ex: CB-990">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-zinc-500 uppercase">Material</label>
                    <input type="text" id="material" required class="w-full p-3 rounded-xl text-sm" placeholder="Nome do item">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-zinc-500 uppercase">Origem</label>
                    <input type="text" id="origem" required class="w-full p-3 rounded-xl text-sm" placeholder="Setor A">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-zinc-500 uppercase">Destino</label>
                    <input type="text" id="destino" required class="w-full p-3 rounded-xl text-sm" placeholder="Setor B">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-zinc-500 uppercase">Peso (KG)</label>
                    <input type="number" step="0.01" id="peso" required class="w-full p-3 rounded-xl text-sm text-blue-400 font-bold" placeholder="0.00">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-zinc-500 uppercase">Turno</label>
                    <select id="turno" class="w-full p-3 rounded-xl text-sm appearance-none cursor-pointer">
                        <option>Turno A</option>
                        <option>Turno B</option>
                        <option>Turno C</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 mt-4 shadow-lg shadow-blue-600/20">
                <i data-lucide="database-zap" size="18"></i> REGISTRAR MOVIMENTAÇÃO
            </button>
        </form>
    </div>

    <script>
        lucide.createIcons();

        // Sua API configurada
        const API_URL = "https://script.google.com/macros/s/AKfycbxlNwblBdyMjInI6ZMLMozkuG80RtuUgQ5WjZYWd3OLQZMaZklnIIa2glAe8Ip1JMzeNA/exec";

        const form = document.getElementById('formRemanejo');
        const btn = document.getElementById('btnSubmit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Estado de carregamento
            btn.disabled = true;
            btn.classList.add('btn-loading');
            btn.innerHTML = `<i data-lucide="loader-2" class="animate-spin"></i> SINCRONIZANDO...`;
            lucide.createIcons();

            const payload = {
                tag_cb: document.getElementById('tag_cb').value,
                material: document.getElementById('material').value,
                origem: document.getElementById('origem').value,
                destino: document.getElementById('destino').value,
                peso: document.getElementById('peso').value,
                turno: document.getElementById('turno').value,
                data: new Date().toLocaleDateString('pt-BR'),
                horario: new Date().toLocaleTimeString('pt-BR')
            };

            try {
                // Envio ignorando bloqueios de CORS (O dado será gravado!)
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Feedback visual de sucesso
                btn.className = "w-full bg-emerald-600 p-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 mt-4 text-white";
                btn.innerHTML = `<i data-lucide="check-circle" size="18"></i> REGISTRADO NA PLANILHA!`;
                lucide.createIcons();
                form.reset();

                setTimeout(() => {
                    btn.disabled = false;
                    btn.classList.remove('btn-loading');
                    btn.className = "w-full bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 mt-4 shadow-lg shadow-blue-600/20 text-white";
                    btn.innerHTML = `<i data-lucide="database-zap" size="18"></i> REGISTRAR MOVIMENTAÇÃO`;
                    lucide.createIcons();
                }, 3000);

            } catch (error) {
                console.error("Erro:", error);
                btn.disabled = false;
                btn.className = "w-full bg-red-600 p-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 mt-4 text-white";
                btn.innerHTML = `<i data-lucide="alert-circle"></i> ERRO DE CONEXÃO`;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
