<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remanejo Enterprise | Logistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://lucide.dev/icons/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #fafafa; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: #18181b; border: 1px solid #27272a; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5); }
        input, select { background: #27272a !important; border: 1px solid #3f3f46 !important; color: white !important; outline: none !important; }
        input:focus { border-color: #3b82f6 !important; ring: 1px solid #3b82f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl glass rounded-2xl p-8">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i data-lucide="package-search" class="text-blue-500"></i> Remanejo
                </h1>
                <p class="text-zinc-500 text-xs uppercase tracking-tighter">Sincronização Cloud v2.0</p>
            </div>
            <div id="badge" class="px-3 py-1 rounded-full bg-blue-500/10 text-blue-500 text-[10px] font-bold border border-blue-500/20">
                SISTEMA PRONTO
            </div>
        </div>

        <form id="formRemanejo" class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-zinc-400">TAG CB</label>
                    <input type="text" id="tag_cb" required class="w-full p-3 rounded-lg text-sm mono" placeholder="Ex: CB-001">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-zinc-400">MATERIAL</label>
                    <input type="text" id="material" required class="w-full p-3 rounded-lg text-sm" placeholder="Nome do item">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-zinc-400">ORIGEM</label>
                    <input type="text" id="origem" required class="w-full p-3 rounded-lg text-sm" placeholder="Setor A">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-zinc-400">DESTINO</label>
                    <input type="text" id="destino" required class="w-full p-3 rounded-lg text-sm" placeholder="Setor B">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-zinc-400">PESO (KG)</label>
                    <input type="number" step="0.01" id="peso" required class="w-full p-3 rounded-lg text-sm text-emerald-400 font-bold" placeholder="0.00">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-zinc-400">TURNO</label>
                    <select id="turno" class="w-full p-3 rounded-lg text-sm">
                        <option>Turno A</option>
                        <option>Turno B</option>
                        <option>Turno C</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 mt-4 shadow-lg shadow-blue-900/20">
                <i data-lucide="send" size="18"></i> REGISTRAR NA PLANILHA
            </button>
        </form>
    </div>

    <script>
        lucide.createIcons();

        // SUBSTITUA ABAIXO PELA SUA NOVA URL DE IMPLANTAÇÃO
        const API_URL = "https://script.google.com/macros/s/AKfycbxlNwblBdyMjInI6ZMLMozkuG80RtuUgQ5WjZYWd3OLQZMaZklnIIa2glAe8Ip1JMzeNA/exec";

        const form = document.getElementById('formRemanejo');
        const btn = document.getElementById('btnSubmit');
        const badge = document.getElementById('badge');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="animate-spin"></i> ENVIANDO...`;
            badge.innerText = "SINCRO_DATA...";
            lucide.createIcons();

            const payload = {
                tag_cb: document.getElementById('tag_cb').value,
                material: document.getElementById('material').value,
                origem: document.getElementById('origem').value,
                destino: document.getElementById('destino').value,
                peso: document.getElementById('peso').value,
                turno: document.getElementById('turno').value,
                data: new Date().toLocaleDateString('pt-BR'),
                horario: new Date().toLocaleTimeString('pt-BR')
            };

            try {
                // No Vercel/Web usamos mode: 'no-cors' para Google Scripts
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Como 'no-cors' não retorna erro fácil, assumimos sucesso se não houver erro de rede
                btn.className = "w-full bg-emerald-600 p-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 mt-4";
                btn.innerHTML = `<i data-lucide="check" size="18"></i> SALVO COM SUCESSO!`;
                badge.innerText = "SYNC_COMPLETE";
                lucide.createIcons();
                form.reset();

                setTimeout(() => {
                    btn.disabled = false;
                    btn.className = "w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 mt-4";
                    btn.innerHTML = `<i data-lucide="send" size="18"></i> REGISTRAR NA PLANILHA`;
                    badge.innerText = "SISTEMA PRONTO";
                    lucide.createIcons();
                }, 3000);

            } catch (error) {
                alert("Erro ao conectar com a API: " + error);
                btn.disabled = false;
                btn.innerHTML = "TENTAR NOVAMENTE";
            }
        });
    </script>
</body>
</html>
